[project]
name = "society-modern-api"
version = "0.1.0"
description = "FastAPI backend for the Society modernization project"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "openpyxl>=3.1.5",
  "PyJWT>=2.10.1",
  "pydantic-settings>=2.10.0",
  "pyodbc>=5.2.0",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.35.0",
  "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
