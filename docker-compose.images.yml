services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: society-modern-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SocietyDev@2026!}
    ports:
      - "14334:1433"
    volumes:
      - society_modern_mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: society-modern-redis
    ports:
      - "6379:6379"

  api:
    image: society-modern-api:latest
    container_name: society-modern-api
    env_file:
      - .env
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DB: ${MSSQL_DB:-SocietyApp}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SocietyDev@2026!}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    image: society-modern-worker:latest
    container_name: society-modern-worker
    command: python -m app.workers.main
    env_file:
      - .env
    environment:
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DB: ${MSSQL_DB:-SocietyApp}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SocietyDev@2026!}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: society-modern-frontend:latest
    container_name: society-modern-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  society_modern_mssql_data:
