services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: society-modern-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "14334:1433"
    volumes:
      - society_modern_mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: society-modern-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: society-modern-api:deploy
    container_name: society-modern-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DB: ${MSSQL_DB:-SocietyApp}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SMS_PROVIDER_MODE: ${SMS_PROVIDER_MODE:-simulated}
      BULKSMSBD_API_KEY: ${BULKSMSBD_API_KEY:-}
      BULKSMSBD_SENDER_ID: ${BULKSMSBD_SENDER_ID:-}
      BULKSMSBD_BASE_URL: ${BULKSMSBD_BASE_URL:-https://bulksmsbd.net/api/}
      BULKSMSBD_TIMEOUT_SECONDS: ${BULKSMSBD_TIMEOUT_SECONDS:-15}
      BULKSMSBD_ENABLED: ${BULKSMSBD_ENABLED:-false}
      BULKSMSBD_DRY_RUN: ${BULKSMSBD_DRY_RUN:-true}
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: society-modern-worker:deploy
    container_name: society-modern-worker
    restart: unless-stopped
    command: python -m app.workers.main
    env_file:
      - .env
    environment:
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DB: ${MSSQL_DB:-SocietyApp}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SMS_PROVIDER_MODE: ${SMS_PROVIDER_MODE:-simulated}
      BULKSMSBD_API_KEY: ${BULKSMSBD_API_KEY:-}
      BULKSMSBD_SENDER_ID: ${BULKSMSBD_SENDER_ID:-}
      BULKSMSBD_BASE_URL: ${BULKSMSBD_BASE_URL:-https://bulksmsbd.net/api/}
      BULKSMSBD_TIMEOUT_SECONDS: ${BULKSMSBD_TIMEOUT_SECONDS:-15}
      BULKSMSBD_ENABLED: ${BULKSMSBD_ENABLED:-false}
      BULKSMSBD_DRY_RUN: ${BULKSMSBD_DRY_RUN:-true}
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: society-modern-frontend:deploy
    container_name: society-modern-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  society_modern_mssql_data:
